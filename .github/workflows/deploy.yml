# Every push to main is tested, then deployed to Fly.io (https://magneye.fly.dev).
# Needs the repository secret FLY_API_TOKEN (a deploy token: `fly tokens create deploy -a magneye`).
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cutting it off mid-rollout.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run pytest -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      # The Docker image builds the web viewer too, on Fly's remote builder.
      - run: flyctl deploy --app magneye --remote-only --ha=false --wait-timeout 600
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
