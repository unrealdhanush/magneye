# Magneye on Fly.io: the Docker image on one always-on machine, with a volume for sessions and caches.
# Secrets (set with `fly secrets set`): MODEL_API_KEY.
app = "magneye"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  MAGNEYE_DATA = "/data"
  MAGNEYE_RUNS_PER_HOUR = "30"

[mounts]
  source = "magneye_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on, so nobody waits for a cold start in the middle of a demo.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
